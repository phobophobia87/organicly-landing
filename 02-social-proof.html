<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشتریان ارگانیکلی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: #0a0a0a; color: #fff; padding: 4rem 2rem; }
        .social-proof { text-align: center; }
        .section-title { font-size: 2.5rem; margin-bottom: 3rem; color: #667eea; }
        .logos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 2rem; max-width: 1200px; margin: 0 auto; }
        .logo-item { background: rgba(255,255,255,0.05); padding: 2rem; border-radius: 10px; display: flex; align-items: center; justify-content: center; height: 100px; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.3s; }
        .logo-item:hover { transform: translateY(-5px); border-color: #667eea; }
        .logo-placeholder { font-size: 1.2rem; color: #888; }
    </style>
</head>
<body>
    <section class="social-proof">
        <h2 class="section-title">مشتریان ما</h2>
        <div class="logos-grid">
            <div class="logo-item"><span class="logo-placeholder">لوگو مشتری ۱</span></div>
            <div class="logo-item"><span class="logo-placeholder">لوگو مشتری ۲</span></div>
            <div class="logo-item"><span class="logo-placeholder">لوگو مشتری ۳</span></div>
            <div class="logo-item"><span class="logo-placeholder">لوگو مشتری ۴</span></div>
            <div class="logo-item"><span class="logo-placeholder">لوگو مشتری ۵</span></div>
            <div class="logo-item"><span class="logo-placeholder">لوگو مشتری ۶</span></div>
        </div>
    </section>
</body>
</html>
