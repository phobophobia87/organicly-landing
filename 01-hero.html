<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارگانیکلی - آژانس دیجیتال مارکتینگ و سئو</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: #0a0a0a; color: #fff; }
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .hero-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); opacity: 0.1; }
        .hero-content { text-align: center; z-index: 1; padding: 2rem; }
        .hero h1 { font-size: 3.5rem; margin-bottom: 1rem; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 1.3rem; color: #ccc; margin-bottom: 2rem; }
        .stats-float { position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%); display: flex; gap: 3rem; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 1.5rem 3rem; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-item { text-align: center; }
        .stat-number { font-size: 2.5rem; font-weight: bold; color: #667eea; }
        .stat-label { font-size: 0.9rem; color: #aaa; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <h1>ارگانیکلی</h1>
            <p>آژانس دیجیتال مارکتینگ و سئو با رویکرد هوش مصنوعی</p>
        </div>
        <div class="stats-float">
            <div class="stat-item">
                <div class="stat-number">۳۰+</div>
                <div class="stat-label">پروژه موفق</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">۹۸٪</div>
                <div class="stat-label">رضایت مشتریان</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">۱۰+</div>
                <div class="stat-label">سال تجربه</div>
            </div>
        </div>
    </section>
</body>
</html>
